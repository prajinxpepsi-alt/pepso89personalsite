<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url("pepso89webgif.gif") no-repeat center center fixed;
      background-size: cover;
    }

    h1, h2 {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: rgb(0, 255, 234);
    }

    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      background-color: aqua;
    }

    li a {
      display: block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
      font-size: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    li a:hover {
      background-color: rgba(0, 0, 0, 0.2);
    }

    .about-box {
      border: 5px solid rgb(11, 101, 179);
      display: inline-block;
      width: 90%;
      max-width: 1000px;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      box-sizing: border-box;
      color: white;
      margin: 40px auto;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
      align-items: center;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 90%;
      max-width: 600px;
      padding: 12px 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      outline: none;
      background-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background-color: rgb(0, 255, 234);
      color: black;
      font-weight: bold;
      font-size: 16px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s;
    }

    button:hover {
      background-color: rgb(0, 200, 180);
      transform: scale(1.05);
    }

    .contact-method {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 30px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      font-size: 18px;
    }

    .contact-method label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    input[type="radio"] {
      accent-color: aqua;
      transform: scale(1.3);
      cursor: pointer;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <center>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/news">News</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/projects">Projects</a></li>
    </ul>

    <br><br><br><br><br><br>

    <div class="about-box">
      <h2>Choose Contact Method</h2>
      <div class="contact-method">
        <label><input type="radio" name="method" value="email" checked onchange="toggleForms()"> Email</label>
        <label><input type="radio" name="method" value="discord" onchange="toggleForms()"> Discord</label>
      </div>

      <!-- Email Form -->
      <form id="emailForm" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="7e32ef14-9dfa-452f-bf3b-608541d9e464">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your message" required></textarea>
        <input type="checkbox" name="botcheck" class="hidden">
        <button type="submit">Send via Email</button>
      </form>

      <!-- Discord Form -->
      <form id="discordForm" class="hidden">
        <input type="text" id="discordName" placeholder="e.g., CoolDude#1234" required>
        <textarea id="discordMessage" placeholder="Yo! What do you wanna say?" required></textarea>
        <button type="button" onclick="sendToDiscord()">Send via Discord</button>
        <p id="discordResult"></p>
      </form>
    </div>
  </center>

  <script>
    function toggleForms() {
      const method = document.querySelector('input[name="method"]:checked').value;
      document.getElementById("emailForm").style.display = method === "email" ? "flex" : "none";
      document.getElementById("discordForm").style.display = method === "discord" ? "flex" : "none";
    }

    function sendToDiscord() {
      const webhookURL = "https://discord.com/api/webhooks/1357406020837834752/hybKemWoXdxnFYF6MRPsrnAql4C3w99dr7zIoqmPeNnu_BMn-yPJZBUl3q267C0_OIMW"; // Replace with your real webhook
      const name = document.getElementById("discordName").value;
      const message = document.getElementById("discordMessage").value;
      const resultBox = document.getElementById("discordResult");

      const payload = {
        content: `**New Message from ${name}**\n${message}`
      };

      resultBox.innerText = "Sending...";

      fetch(webhookURL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (response.ok) {
          resultBox.innerText = "Message sent to Discord!";
        } else {
          resultBox.innerText = "Failed to send message.";
        }
      })
      .catch(error => {
        resultBox.innerText = "Error sending message.";
        console.error(error);
      });
    }
  </script>
</body>
</html>
